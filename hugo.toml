baseURL = "https://dalnoboy-dev.pages.dev/"
languageCode = "ru-ru"
defaultContentLanguage = "ru"
title = "Дальнобойный Программист"
theme = "terminal"

[params]
  contentTypeName = "posts"
  showMenuItems = 2
  showLanguageSelector = false
  fullWidthTheme = true
  centerTheme = true
  autoCover = false
  showLastUpdated = false
  disableHeadingsAnchors = false

[languages]
  [languages.ru]
    languageName = "Русский"
    title = "Дальнобойный Программист"
    subtitle = "Пишу код на кураже, без вышки и без снобизма"
    owner = "Дальнобойный Программист"
    keywords = ["вайбкодинг", "Python", "Telegram-боты", "ИИ"]
    copyright = "© 2026 Дальнобойный Программист"
    menuMore = "Показать ещё"
    readMore = "Читать"
    readOtherPosts = "Другие статьи"

    [languages.ru.params]
      subtitle = "Пишу код на кураже, без вышки и без снобизма"

      [languages.ru.params.logo]
        logoText = "Дальнобойный Программист"
        logoHomeLink = "/"

    [languages.ru.menu]
      [[languages.ru.menu.main]]
        identifier = "about"
        name = "Обо мне"
        url = "/about/"
        weight = 10
      [[languages.ru.menu.main]]
        identifier = "projects"
        name = "Проекты"
        url = "/projects/"
        weight = 20