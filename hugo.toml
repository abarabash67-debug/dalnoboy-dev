baseURL = "https://dalnoboy-dev.pages.dev/"
languageCode = "ru-ru"
defaultContentLanguage = "ru"
title = "Charon Labs"
theme = "re-terminal"

[params]
  contentTypeName = "posts"
  showMenuItems = 4
  showLanguageSelector = false
  fullWidthTheme = false
  centerTheme = true
  autoCover = false
  showLastUpdated = false
  disableHeadingsAnchors = false
  themeColor = "blue"

[languages]
  [languages.ru]
    languageName = "Русский"
    title = "Charon Labs"
    subtitle = "Скиллы для ИИ-агентов. Инфраструктурная безопасность. Аналитика угроз"
    owner = "Charon Labs"
    keywords = ["ИИ-безопасность", "скиллы для агентов", "RAG-уязвимости", "вайбкодинг", "Python", "Telegram-боты"]
    copyright = "© 2026 Charon Labs"
    menuMore = "Показать ещё"
    readMore = "Читать"
    readOtherPosts = "Другие статьи"

    [languages.ru.params]
      subtitle = "Скиллы для ИИ-агентов. Инфраструктурная безопасность. Аналитика угроз"

      [languages.ru.params.logo]
        logoText = "Charon Labs"
        logoHomeLink = "/"

    [[languages.ru.menu.main]]
        identifier = "about"
        name = "О себе"
        url = "/about/"
        weight = 10
      [[languages.ru.menu.main]]
        identifier = "blog"
        name = "Блог"
        url = "/posts/"
        weight = 10
      [[languages.ru.menu.main]]
        identifier = "projects"
        name = "Скиллы"
        url = "/projects/"
        weight = 20

[pagination]
  pagerSize = 5

  [markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true